# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: ve-gauges-indexer
contracts:
  - name: VotingEscrowIncreasing
    handler: src/EventHandlers.ts
    events:
      - event: Deposit(address indexed depositor, uint256 indexed tokenId, uint256 indexed startTs, uint256 value, uint256 newTotalLocked)
      - event: MinDepositSet(uint256 minDeposit)
      - event: Withdraw(address indexed depositor, uint256 indexed tokenId, uint256 value, uint256 ts, uint256 newTotalLocked)
      - event: Upgraded(address indexed implementation)
      - event: Initialized(uint8 version)
  - name: SimpleGaugeVoter
    handler: src/EventHandlers.ts
    events:
      - event: GaugeActivated(address indexed gauge)
      - event: GaugeCreated(address indexed gauge, address indexed creator, string metadataURI)
      - event: GaugeDeactivated(address indexed gauge)
      - event: GaugeMetadataUpdated(address indexed gauge, string metadataURI)
      - event: Reset(address indexed voter, address indexed gauge, uint256 indexed epoch, uint256 tokenId, uint256 votingPowerRemovedFromGauge, uint256 totalVotingPowerInGauge, uint256 totalVotingPowerInContract, uint256 timestamp)
        field_selection:
          transaction_fields:
            - from
      - event: Voted(address indexed voter, address indexed gauge, uint256 indexed epoch, uint256 tokenId, uint256 votingPowerCastForGauge, uint256 totalVotingPowerInGauge, uint256 totalVotingPowerInContract, uint256 timestamp)
      - event: Upgraded(address indexed implementation)
      - event: Initialized(uint8 version)
  - name: ExitQueue
    handler: src/EventHandlers.ts
    events:
      - event: ExitQueued(uint256 indexed tokenId, address indexed holder, uint256 exitDate)
      - event: Upgraded(address indexed implementation)
      - event: Initialized(uint8 version)
chains:
